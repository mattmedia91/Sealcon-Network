<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Optimized Embedded Application</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            height: auto !important;
            background-color: #0b0f17;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        #app-wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .step-panel {
            display: none;
            width: 100%;
        }

        .step-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #d1d5db;
        }

        /* 16px minimum font size disables iOS Safari automatic viewport zoom */
        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            font-size: 16px !important;
            border: 1px solid #374151;
            border-radius: 6px;
            background-color: #1f2937;
            color: #ffffff;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #f59e0b;
        }

        .btn-action {
            width: 100%;
            min-height: 52px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #0b0f17;
            background-color: #f59e0b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-action:active {
            background-color: #d97706;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- Step 1 View -->
        <div id="step-1" class="step-panel active">
            <h2 style="margin-bottom: 16px;">Step 1: Project Location</h2>
            <div class="form-group">
                <label for="input-zip">ZIP Code</label>
                <input type="text" id="input-zip" pattern="[0-9]*" inputmode="numeric" placeholder="e.g. 07461">
            </div>
            <button type="button" id="btn-next-step" class="btn-action">Continue to Contact Details</button>
        </div>

        <!-- Step 2 View -->
        <div id="step-2" class="step-panel">
            <h2 style="margin-bottom: 16px;">Step 2: Customer Verification</h2>
            <div class="form-group">
                <label for="input-name">Full Name</label>
                <input type="text" id="input-name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="input-phone">Phone Number</label>
                <input type="tel" id="input-phone" placeholder="(973) 555-0199">
            </div>
            <button type="button" id="btn-submit-form" class="btn-action">Submit Quote Request</button>
        </div>
    </div>

    <script>
        // -----------------------------------------------------------------
        // 1. Dynamic Height Dispatching (ResizeObserver Engine)
        // -----------------------------------------------------------------
        const appWrapper = document.getElementById('app-wrapper');

        function dispatchFrameHeight() {
            if (window.parent && window.parent !== window) {
                // Compute true rendered bounding height to prevent scrollHeight traps
                const renderedHeight = Math.ceil(appWrapper.getBoundingClientRect().height + 32);
                window.parent.postMessage({
                    type: 'APP_FRAME_RESIZE',
                    height: renderedHeight
                }, '*');
            }
        }

        if ('ResizeObserver' in window) {
            const observer = new ResizeObserver(() => {
                dispatchFrameHeight();
            });
            observer.observe(appWrapper);
        } else {
            window.addEventListener('load', dispatchFrameHeight);
            window.addEventListener('resize', dispatchFrameHeight);
        }

        // -----------------------------------------------------------------
        // 2. Touch-Optimized Pointer Event Handling
        // -----------------------------------------------------------------
        function attachFastTouchHandler(elementId, callback) {
            const target = document.getElementById(elementId);
            let gestureHandled = false;

            target.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                    gestureHandled = true;
                    callback(e);
                }
            });

            target.addEventListener('click', (e) => {
                if (!gestureHandled) {
                    callback(e);
                }
                gestureHandled = false;
            });
        }

        // Step 1 Transition Logic
        attachFastTouchHandler('btn-next-step', () => {
            const zipVal = document.getElementById('input-zip').value.trim();
            if (!zipVal) {
                alert('Please provide a valid ZIP code.');
                return;
            }

            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
            
            // Recalculate parent height immediately after panel switch
            dispatchFrameHeight();
        });

        // Step 2 Submission (Secure Asynchronous Webhook Dispatch)
        attachFastTouchHandler('btn-submit-form', () => {
            const nameVal = document.getElementById('input-name').value.trim();
            const phoneVal = document.getElementById('input-phone').value.trim();
            const zipVal = document.getElementById('input-zip').value.trim();

            if (!nameVal || !phoneVal) {
                alert('Please enter your contact details.');
                return;
            }

            const payload = {
                name: nameVal,
                phone: phoneVal,
                zip: zipVal,
                submittedAt: new Date().toISOString()
            };

            fetch('https://boaster-mustang-pasture.ngrok-free.dev/webhook/client-application', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP Status Error: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                alert('Quote request dispatched successfully!');
                location.reload();
            })
            .catch(error => {
                console.error('Submission execution failure:', error);
                alert('Network dispatch failure. Please check your connection.');
            });
        });
    </script>
</body>
</html>
